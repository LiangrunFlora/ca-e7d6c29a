<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="聊天存档">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#232326" media="(prefers-color-scheme: dark)">
<title>聊天存档</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="bar">
      <button id="btnTop" aria-label="回到最早"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
      <h1 id="title">聊天存档</h1>
      <button id="btnSearch" aria-label="搜索"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg></button>
      <button id="btnMenu" aria-label="菜单"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </div>
    <div class="sub">
      <svg width="18" height="16" viewBox="0 0 24 21" aria-hidden="true"><defs><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#e3c6fb"/><stop offset="1" stop-color="#c5cdfb"/></linearGradient></defs><path fill="url(#hg)" d="M12 21S0 13.5 0 6.3C0 2.8 2.7 0 6 0c2.4 0 4.6 1.4 6 3.5C13.4 1.4 15.6 0 18 0c3.3 0 6 2.8 6 6.3C24 13.5 12 21 12 21z"/></svg>
      <span id="days">+ 0</span>
    </div>
    <div class="searchbox" id="searchbox" hidden>
      <input id="q" type="search" placeholder="搜索韩文或中文…" autocomplete="off">
      <span id="count"></span>
    </div>
  </header>

  <main id="list"><div class="empty">正在打开…</div></main>

  <footer>
    <button class="fake" id="btnAdd2"><span>添加一条消息</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><circle cx="8.8" cy="10" r=".8" fill="currentColor"/><circle cx="15.2" cy="10" r=".8" fill="currentColor"/><path d="M8 14.5c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="send" id="btnAdd" aria-label="添加消息"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M22 3L2 10.5l8 2.5 2.5 8L22 3z"/><path d="M10 13l12-10"/></svg></button>
  </footer>

  <!-- menu -->
  <div class="mask" id="menuMask" hidden><div class="sheet menu">
    <button data-act="jump">跳到某一天</button>
    <button data-act="bottom">回到最新</button>
    <button data-act="add">添加消息</button>
    <button data-act="import">导入（截图识别文件 / 备份）</button>
    <button data-act="export">导出完整备份</button>
    <button data-act="profile">编辑标题 / 昵称 / 头像 / 天数</button>
    <button data-act="password">修改打开密码</button>
    <div class="storage" id="storageInfo"></div>
    <button data-act="close">取消</button>
  </div></div>

  <!-- jump -->
  <div class="mask" id="jumpMask" hidden><div class="sheet">
    <h2>跳到某一天</h2>
    <input id="jDate" type="date">
    <div class="hint" id="jHint"></div>
    <div class="actions"><button id="jCancel">取消</button><button class="primary" id="jGo">跳转</button></div>
  </div></div>

  <!-- edit -->
  <div class="mask" id="editMask" hidden><div class="sheet">
    <h2 id="editTitle">添加消息</h2>
    <div class="seg" role="radiogroup" aria-label="发送人">
      <button id="segArtist" role="radio" aria-checked="true">艺人</button>
      <button id="segMe" role="radio" aria-checked="false">我</button>
    </div>
    <div class="two">
      <div><label for="fDate">日期</label><input id="fDate" type="date"></div>
      <div><label for="fTime">时间</label><input id="fTime" type="time"></div>
    </div>
    <label for="fKo">原文</label>
    <textarea id="fKo" placeholder="모하고있어!!!"></textarea>
    <label for="fZh">翻译（可留空）</label>
    <textarea id="fZh" placeholder="你在干什么！！！"></textarea>
    <label for="fMedia">图片 / 视频 / 语音（可选）</label>
    <input id="fMedia" type="file" accept="image/*,video/*,audio/*">
    <div class="hint" id="mediaHint"></div>
    <label class="check" id="rmRow" hidden><input type="checkbox" id="fRm"> 移除当前附件</label>
    <div class="actions">
      <button class="del" id="btnDel">删除</button>
      <button id="btnCancel">取消</button>
      <button class="primary" id="btnSave">保存</button>
    </div>
  </div></div>

  <!-- profile -->
  <div class="mask" id="profMask" hidden><div class="sheet">
    <h2>编辑资料</h2>
    <label for="pTitle">聊天标题</label><input id="pTitle">
    <label for="pName">艺人昵称</label><input id="pName">
    <label for="pDays">天数（显示为 + N）</label><input id="pDays" type="number" inputmode="numeric">
    <label for="pAva">艺人头像</label><input id="pAva" type="file" accept="image/*">
    <div class="actions"><button id="pCancel">取消</button><button class="primary" id="pSave">保存</button></div>
  </div></div>

  <!-- image viewer -->
  <div class="viewer" id="viewer" hidden>
    <img id="vImg" alt="">
    <div class="vbar"><button id="vEdit">编辑这条</button><button id="vClose">关闭</button></div>
  </div>

  <!-- change password -->
  <div class="mask" id="pwMask" hidden><div class="sheet">
    <h2>修改打开密码</h2>
    <label for="pwOld">当前密码</label><input id="pwOld" type="password" autocomplete="current-password">
    <label for="pwNew">新密码（至少 4 位）</label><input id="pwNew" type="password" autocomplete="new-password">
    <label for="pwNew2">再输一次新密码</label><input id="pwNew2" type="password" autocomplete="new-password">
    <div class="actions"><button id="pwCancel">取消</button><button class="primary" id="pwSave">保存</button></div>
  </div></div>

  <!-- lock screen -->
  <div class="lock" id="lock" hidden>
    <form class="lockbox" id="lockForm">
      <img src="icons/icon-192.png" alt="" width="72" height="72">
      <h2 id="lockTitle">输入密码</h2>
      <p id="lockHint"></p>
      <input id="lockPw" type="password" placeholder="密码" autocomplete="current-password">
      <input id="lockPw2" type="password" placeholder="再输一次" autocomplete="new-password" hidden>
      <button class="primary" id="lockGo" type="submit">解锁</button>
      <button class="linkish" id="lockForgot" type="button">忘记密码</button>
      <div class="forgot" id="forgotBox" hidden>
        <p>密码无法找回，只能清空这台手机上的全部聊天记录后重新设置。清空前请确认你有导出的备份。</p>
        <button class="danger" id="wipeBtn" type="button">清空全部数据</button>
      </div>
    </form>
  </div>

  <input type="file" id="importFile" accept=".zip,.json,application/zip,application/json" hidden>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
